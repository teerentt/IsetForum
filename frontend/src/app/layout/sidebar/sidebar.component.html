<aside class="sidebar" aria-label="Navigation latérale">
  <nav class="main-nav" aria-label="Navigation principale">
    <button [class.selected]="ui.view() === 'feed' && !ui.communityId()" [attr.aria-current]="ui.view() === 'feed' && !ui.communityId() ? 'page' : null" (click)="ui.navigate('feed')"><app-icon name="home" />Fil du campus</button>
    <button [class.selected]="ui.view() === 'communities' || !!ui.communityId()" [attr.aria-current]="ui.view() === 'communities' ? 'page' : null" (click)="ui.navigate('communities')"><app-icon name="users" />Communautés</button>
    @if (forum.person()) {
      <button [class.selected]="ui.view() === 'profile'" [attr.aria-current]="ui.view() === 'profile' ? 'page' : null" (click)="ui.navigate('profile')"><app-icon name="user" />Mon profil</button>
    }
    @if (forum.person()?.role === 'ADMIN') {
      <button [class.selected]="ui.view() === 'admin'" [attr.aria-current]="ui.view() === 'admin' ? 'page' : null" (click)="ui.navigate('admin')"><app-icon name="shield" />Administration</button>
    }
  </nav>
  @if (ui.view() !== 'feed') {
    <button class="publish-shortcut" (click)="ui.compose()"><app-icon name="plus" />Publier</button>
  }
  @if (ui.joined().length) {
    <section class="community-shortcuts" aria-labelledby="joined-title">
      <h2 id="joined-title">Mes communautés</h2>
      @for (community of ui.joined(); track community.id) {
        <button class="community-shortcut" [class.selected]="ui.communityId() === community.id" [attr.aria-current]="ui.communityId() === community.id ? 'page' : null" (click)="ui.openCommunity(community)">
          <app-community-visual class="compact" [name]="community.name" /><span>{{ community.name }}</span>
        </button>
      }
    </section>
  }
  @if (forum.person()) {
    <button class="session-button" (click)="ui.logout()"><app-icon name="logout" />Se déconnecter</button>
  }
</aside>
