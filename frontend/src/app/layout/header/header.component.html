<header class="topbar">
  <div class="brand-area">
    <button class="icon-button mobile-menu" aria-label="Afficher la navigation" [attr.aria-expanded]="ui.mobileNav()" (click)="ui.mobileNav.set(!ui.mobileNav())"><app-icon name="menu" /></button>
    <a class="brand" href="/forum/accueil" (click)="$event.preventDefault(); ui.navigate('feed')"><img src="assets/logo-iset.png" alt="Logo de l’ISET Radès" /><span>Iset<span class="brand-secondary">Forum</span></span></a>
  </div>
  <label class="global-search"><app-icon name="search" /><input #search type="search" placeholder="Rechercher sur IsetForum" aria-label="Rechercher des publications ou communautés" [ngModel]="ui.query()" (ngModelChange)="searchFor($event)" /><kbd>/</kbd></label>
  <div class="header-account">
    @if (forum.person(); as person) {
      @if (ui.view() !== 'admin') { <button class="primary-button create-post" aria-label="Créer une publication" title="Créer une publication" (click)="ui.compose()"><app-icon name="plus" /><span>Créer une publication</span></button> }
      <button class="icon-button profile-button" (click)="ui.navigate('profile')" aria-label="Mon profil" title="Mon profil"><span class="avatar">{{ person.initials }}</span></button>
      <button class="icon-button logout-button" (click)="ui.logout()" aria-label="Se déconnecter" title="Se déconnecter"><app-icon name="logout" /></button>
    } @else { <button class="primary-button" (click)="ui.login()">Se connecter</button> }
    <button class="icon-button theme-button" (click)="theme.toggle()" [attr.aria-label]="theme.theme() === 'dark' ? 'Activer le mode clair' : 'Activer le mode sombre'" [title]="theme.theme() === 'dark' ? 'Mode clair' : 'Mode sombre'"><app-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" /></button>
  </div>
</header>
