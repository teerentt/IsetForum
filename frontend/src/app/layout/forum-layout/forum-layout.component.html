<a class="skip-link" href="#main" (click)="$event.preventDefault(); mainContent.focus()">Aller au contenu</a>
<app-header />
<div class="app-layout">
  <app-sidebar />
  <main #mainContent id="main" tabindex="-1" class="main-content"><router-outlet /></main>
  <aside class="context-sidebar" aria-labelledby="community-index-title">
    <div class="index-heading">
      <h2 id="community-index-title">À découvrir</h2>
      <button class="text-link" (click)="ui.navigate('communities')" aria-label="Voir toutes les communautés">Tout voir <span aria-hidden="true">→</span></button>
    </div>
    @if (!ui.forum.loading() && !ui.forum.error()) {
      <ul class="community-index">
        @for (community of ui.forum.communities().slice(0, 4); track community.id) {
          <li>
            <button (click)="ui.openCommunity(community)">
              <app-community-visual class="compact" [name]="community.name" />
              <span>
                <strong>{{ community.name }}</strong>
                <small>{{ community.visibility === 'PUBLIC' ? 'Publique' : 'Privée' }} · {{ community.memberCount }} {{ community.memberCount === 1 ? 'membre' : 'membres' }}</small>
              </span>
            </button>
          </li>
        }
      </ul>
      @if (!ui.forum.communities().length) {
        <p class="index-empty">Aucune communauté pour le moment.</p>
      }
    }
  </aside>
</div>
<app-forum-dialog />
<app-notification />
