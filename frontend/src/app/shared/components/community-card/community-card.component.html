<article class="community-card panel"><div class="community-card-top"><span [class]="'community-icon ' + community().color"><app-icon [name]="community().icon" /></span><span class="visibility"><app-icon [name]="community().visibility === 'private' ? 'lock' : 'globe'" />{{ community().visibility === 'private' ? 'Privée' : 'Publique' }}</span></div><button class="title-button" (click)="ui.openCommunity(community())"><h2>{{ community().name }}</h2></button><p>{{ community().description }}</p><div class="community-card-bottom"><span><app-icon name="users" />{{ community().members | number }} membres</span><button class="join-button" [class.joined]="forum.status(community().id) === 'active'" (click)="ui.membership(community())">{{ forum.status(community().id) === 'active' ? 'Quitter' : forum.status(community().id) === 'pending' ? 'Annuler la demande' : community().visibility === 'private' ? 'Demander à rejoindre' : 'Rejoindre' }}<app-icon [name]="forum.status(community().id) === 'active' ? 'check' : 'plus'" /></button></div>@if (community().visibility === 'private') { <small class="privacy-note">Présentation publique. Publications réservées aux membres.</small> }</article>
