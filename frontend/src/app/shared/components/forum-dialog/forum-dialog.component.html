<dialog #dialog class="modal" (cancel)="$event.preventDefault(); ui.closeModal()" (click)="backdrop($event)" aria-labelledby="modal-title"><div class="modal-inner"><button class="modal-close icon-button" aria-label="Fermer" [disabled]="ui.busy()" (click)="ui.closeModal()"><app-icon name="close" /></button>@switch (ui.modal()) { @case ('post') { <app-post-form /> } @case ('community') { <app-community-form /> } }</div></dialog>
