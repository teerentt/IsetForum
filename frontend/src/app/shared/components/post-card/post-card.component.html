<article class="post-card">
  @if (forum.community(post().communityId); as community) {
    <a class="community-label" [routerLink]="['/forum/communautes', community.id]">{{ community.name }}</a>
  }
  <a class="title-button" [routerLink]="['/forum/publications', post().id]">
    <h2>{{ post().title }}</h2>
    <app-icon name="arrow" />
  </a>
  <p class="post-excerpt">{{ post().content }}</p>
  <div class="post-meta">
    <span class="author-name">{{ post().authorName }}</span>
    <span aria-hidden="true">·</span>
    <time [attr.datetime]="post().createdAt">{{ post().createdAt | date:"dd/MM/yyyy 'à' HH:mm" }}</time>
    @if (post().authorId === forum.person()?.id) {
      <span aria-hidden="true">·</span><span>Votre publication</span>
    }
  </div>
</article>
