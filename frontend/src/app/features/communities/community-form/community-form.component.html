<p class="eyebrow accent-text">RASSEMBLEZ VOTRE CAMPUS</p><h2 id="modal-title">Créer une communauté</h2><form (ngSubmit)="submit()" #form="ngForm"><label>Nom de la communauté<input name="name" [(ngModel)]="name" maxlength="100" required /></label><label>De quoi parle-t-on ?<textarea name="description" [(ngModel)]="description" rows="4" maxlength="1000" required></textarea></label><label>Visibilité<select name="visibility" [(ngModel)]="visibility"><option value="PUBLIC">Publique</option><option value="PRIVATE">Privée</option></select></label><p class="form-note">La présentation est toujours publique. Dans un espace privé, les publications et documents sont réservés aux membres actifs et aux administrateurs.</p>@if (error) { <p class="form-error" role="alert">{{ error }}</p> }<div class="modal-actions"><button class="secondary-button" type="button" [disabled]="ui.busy()" (click)="ui.closeModal()">Annuler</button><button class="primary-button" type="submit" [disabled]="ui.busy() || form.invalid || !name.trim() || !description.trim()">Créer la communauté</button></div></form>
