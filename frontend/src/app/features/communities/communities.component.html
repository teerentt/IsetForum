<div class="page-heading"><div><h1>Communautés</h1><p>Trouvez votre groupe pour échanger, apprendre et avancer ensemble.</p></div></div>
<div class="list-toolbar"><span>{{ ui.filteredCommunities().length }} communautés à découvrir</span><button class="primary-button" (click)="ui.startCommunity()"><app-icon name="plus" />Créer une communauté</button></div>
<div class="community-grid">@for (community of ui.filteredCommunities(); track community.id) { <app-community-card [community]="community" /> } @empty { <div class="empty-state panel"><h2>Aucune communauté trouvée</h2><p>Essayez un autre mot-clé.</p><button class="secondary-button" (click)="ui.query.set('')">Effacer la recherche</button></div> }</div>
